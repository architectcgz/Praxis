<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>鹈鹕的慢骑日记 · 海岸公路</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f5ef;
      --ink: #293d37;
      --muted: #737b6e;
      --line: #dadfd2;
      --accent: #c65b3d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.6 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    button svg { width: 18px; height: 18px; flex: none; }
    [hidden] { display: none !important; }
    .page { width: min(1200px, calc(100% - 80px)); margin: 0 auto; }
    .masthead { display: flex; justify-content: space-between; align-items: center; min-height: 88px; border-bottom: 1px solid var(--line); gap: 20px; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 15px; font-weight: 650; }
    .brand-mark { width: 38px; height: 38px; color: var(--accent); }
    .masthead-note { color: var(--muted); font-size: 12px; }
    .intro { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 40px 0 30px; }
    .eyebrow { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; color: var(--accent); font-size: 12px; }
    .eyebrow::before { content: ""; width: 24px; height: 1px; background: currentColor; }
    h1 { margin: 0; font-family: "Songti SC", "STSong", "SimSun", Georgia, serif; font-size: 42px; font-weight: 600; line-height: 1.4; }
    .intro-copy { margin: 12px 0 0; color: var(--muted); }
    .day-note { flex: none; padding-left: 24px; border-left: 1px solid var(--line); }
    .day-note small { display: block; color: var(--muted); margin-bottom: 6px; }
    .day-note strong { font-family: "Songti SC", "SimSun", serif; font-size: 22px; font-weight: 500; }
    figure { margin: 0; }
    .canvas { position: relative; overflow: hidden; border: 1px solid #d8ded0; border-radius: 12px; background: #eaf0e8; }
    .scene { display: block; width: 100%; height: auto; }
    .scene-label { position: absolute; top: 22px; left: 24px; display: flex; align-items: center; gap: 8px; color: #536757; font-size: 12px; pointer-events: none; }
    .scene-label svg { width: 17px; height: 17px; }
    .scene-number { position: absolute; top: 22px; right: 24px; color: #667968; font: 12px/1.6 Consolas, monospace; }
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 20px 0; border-bottom: 1px solid var(--line); }
    .playback { display: flex; align-items: center; gap: 20px; }
    .play-button { display: flex; align-items: center; justify-content: center; gap: 9px; min-width: 128px; height: 44px; border: 1px solid var(--ink); border-radius: 6px; background: var(--ink); color: #fffdf5; transition: background 150ms; }
    .play-button:hover { background: #415b4e; }
    .status { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .status-dot { width: 6px; height: 6px; background: #588c6b; border-radius: 50%; }
    .status[data-paused="true"] .status-dot { background: #a99273; }
    .settings { display: flex; align-items: center; gap: 16px; }
    .speed-control { display: flex; align-items: center; gap: 13px; color: #626f61; font-size: 12px; }
    input[type="range"] { width: 120px; height: 24px; margin: 0; accent-color: var(--ink); cursor: pointer; }
    output { min-width: 42px; color: var(--ink); font: 12px/1.6 Consolas, monospace; }
    .reset-button { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); }
    .reset-button:hover { background: #e9ede3; }
    figcaption { display: flex; justify-content: space-between; gap: 20px; padding: 17px 0; color: var(--muted); font-size: 12px; }
    .caption-title { color: #52604e; }
    .caption-title span { padding-right: 12px; color: var(--accent); font-family: Georgia, serif; font-style: italic; }
    footer { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 23px 0 30px; color: #818777; font-size: 12px; }
    footer::before, footer::after { content: ""; width: 28px; height: 1px; background: var(--line); }
    @media (max-width: 680px) {
      .page { width: calc(100% - 32px); }
      .masthead { min-height: 68px; }
      .masthead-note, .day-note, .caption-meta { display: none; }
      .intro { padding: 28px 0 24px; }
      h1 { font-size: 30px; }
      .intro-copy { font-size: 12px; max-width: 26em; }
      .scene { height: 360px; object-fit: cover; }
      .scene-label { left: 16px; top: 16px; }
      .scene-number { right: 16px; top: 16px; }
      .controls { flex-wrap: wrap; gap: 16px; padding: 16px 0; }
      .playback, .settings { width: 100%; justify-content: space-between; }
      .speed-control { flex: 1; padding-right: 20px; }
      input[type="range"] { flex: 1; width: 80px; }
      figcaption { padding: 16px 0 0; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none !important; } }
  </style>
</head>

  <script>
    const byId = (id) => document.getElementById(id);
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const parts = Object.fromEntries([
      'rear-spokes', 'front-spokes', 'crank', 'back-leg', 'front-leg',
      'back-foot', 'front-foot', 'pelican', 'eye', 'scarf', 'clouds',
      'gulls', 'water', 'road', 'verge'
    ].map((id) => [id, byId(id)]));
    const play = byId('play');
    const speed = byId('speed');
    let paused = reducedMotion.matches;
    let elapsed = 0;
    let previousTime = null;
    let frameId = null;

    // 两段等长腿通过几何求解膝盖位置，让脚始终贴住踏板，而不是独立摆动。
    function drawLeg(side, hipX, hipY, angle) {
      const footX = 555 + Math.cos(angle) * 27;
      const footY = 451 + Math.sin(angle) * 27;
      const dx = footX - hipX;
      const dy = footY - hipY;
      const distance = Math.hypot(dx, dy);
      const bend = Math.sqrt(Math.max(0, 84 * 84 - distance * distance / 4));
      const kneeX = hipX + dx / 2 + dy / distance * bend;
      const kneeY = hipY + dy / 2 - dx / distance * bend;
      parts[`${side}-leg`].setAttribute('d', `M${hipX} ${hipY} Q${kneeX} ${kneeY} ${kneeX} ${kneeY} L${footX} ${footY}`);
      parts[`${side}-foot`].setAttribute('transform', `translate(${footX} ${footY})`);
    }

    function drawScene() {
      const phase = elapsed * Math.PI * 2 / 2.4;
      const degrees = phase * 180 / Math.PI;
      const travel = phase * 1.3 * 90;
      const bob = Math.sin(phase * 2) * 1.8;
      parts['rear-spokes'].setAttribute('transform', `rotate(${degrees * 1.3 % 360})`);
      parts['front-spokes'].setAttribute('transform', `rotate(${degrees * 1.3 % 360})`);
      parts.crank.setAttribute('transform', `rotate(${degrees % 360} 555 451)`);
      parts.pelican.setAttribute('transform', `translate(0 ${bob})`);
      drawLeg('back', 522, 329 + bob, phase + Math.PI);
      drawLeg('front', 536, 329 + bob, phase);
      parts.road.setAttribute('patternTransform', `translate(${-travel % 180} 0)`);
      parts.verge.setAttribute('transform', `translate(${-travel % 1160} 0)`);
      parts.water.setAttribute('patternTransform', `translate(${-travel * 0.16 % 180} 0)`);
      parts.clouds.setAttribute('transform', `translate(${-elapsed * 7 % 1500} 0)`);
      parts.gulls.setAttribute('transform', `translate(0 ${Math.sin(elapsed * 1.3) * 4})`);
      parts.scarf.setAttribute('transform', `rotate(${Math.sin(phase * 1.8) * 5} 610 241)`);
      const blink = elapsed % 5.8;
      const eyeScale = blink > 5.6 ? Math.max(0.08, Math.abs(blink - 5.7) * 10) : 1;
      parts.eye.setAttribute('transform', `translate(674 169) scale(1 ${eyeScale})`);
    }

    // 暂停或切走页面时停止请求帧，恢复时重新计时，避免后台时间造成画面跳跃。
    function tick(now) {
      if (previousTime !== null) elapsed += Math.min((now - previousTime) / 1000, 0.05) * Number(speed.value);
      previousTime = now;
      drawScene();
      frameId = requestAnimationFrame(tick);
    }

    function syncPlayback() {
      if (frameId !== null) cancelAnimationFrame(frameId);
      frameId = null;
      previousTime = null;
      play.setAttribute('aria-pressed', String(paused));
      play.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
      byId('play-label').textContent = paused ? '继续兜风' : '歇一会儿';
      byId('pause-icon').toggleAttribute('hidden', paused);
      byId('play-icon').toggleAttribute('hidden', !paused);
      byId('status').dataset.paused = String(paused);
      byId('status-label').textContent = paused ? '停下来，看看海' : '正在兜风';
      if (!paused && !document.hidden) frameId = requestAnimationFrame(tick);
    }

    play.addEventListener('click', () => { paused = !paused; syncPlayback(); });
    speed.addEventListener('input', () => {
      byId('speed-value').value = `${Number(speed.value).toFixed(2)}×`;
      speed.setAttribute('aria-valuetext', `${speed.value} 倍速度`);
    });
    byId('reset').addEventListener('click', () => { elapsed = 0; previousTime = null; drawScene(); });
    document.addEventListener('visibilitychange', syncPlayback);
    reducedMotion.addEventListener('change', (event) => {
      if (event.matches) { paused = true; syncPlayback(); }
    });
    drawScene();
    syncPlayback();
  </script>
</body>
</html>
