<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕的晨间骑行</title>
  <style>
    :root {
      --ink: #173548;
      --muted: #58717a;
      --paper: #f6f2e9;
      --panel: #fffdf7;
      --line: #d8e0d9;
      --mint: #78b7a8;
      --coral: #dc725f;
      --yellow: #f2c75c;
      --speed: 1;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button,
    input { font: inherit; }

    button { cursor: pointer; }

    .page {
      width: min(1320px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 34px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 18px;
    }

    .title-block { max-width: 620px; }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--coral);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .kicker::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--coral);
      content: "";
    }

    h1 {
      margin: 8px 0 8px;
      font-size: clamp(30px, 4vw, 54px);
      line-height: 1.03;
      letter-spacing: 0;
    }

    .intro {
      max-width: 520px;
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .route-stats {
      display: flex;
      gap: 10px;
      align-items: stretch;
      padding-top: 3px;
    }

    .stat {
      min-width: 112px;
      padding: 13px 15px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 247, 0.66);
    }

    .stat-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .stat strong {
      font-size: 20px;
      line-height: 1;
    }

    .stage-frame {
      position: relative;
      overflow: hidden;
      border: 1px solid #cdd9d1;
      border-radius: 8px;
      background: #c9e8e8;
      box-shadow: 0 16px 36px rgba(39, 73, 79, 0.1);
    }

    .scene {
      display: block;
      width: 100%;
      height: auto;
    }

    .scene .wheel-spin,
    .scene .pedal-spin,
    .scene .pelican-bob,
    .scene .wing-flap,
    .scene .leg-pedal,
    .scene .cloud-drift,
    .scene .cloud-drift-slow,
    .scene .road-flow,
    .scene .flag-wave {
      transform-box: fill-box;
      transform-origin: center;
    }

    .scene .wheel-spin {
      animation: wheel-spin calc(1.15s / var(--speed)) linear infinite;
    }

    .scene .pedal-spin {
      animation: wheel-spin calc(1.15s / var(--speed)) linear infinite reverse;
    }

    .scene .pelican-bob {
      animation: pelican-bob calc(1.15s / var(--speed)) ease-in-out infinite;
    }

    .scene .wing-flap {
      animation: wing-flap calc(1.15s / var(--speed)) ease-in-out infinite;
    }

    .scene .leg-pedal {
      animation: leg-pedal calc(1.15s / var(--speed)) ease-in-out infinite;
    }

    .scene .cloud-drift {
      animation: cloud-drift calc(25s / var(--speed)) linear infinite;
    }

    .scene .cloud-drift-slow {
      animation: cloud-drift calc(38s / var(--speed)) linear infinite reverse;
    }

    .scene .road-flow {
      animation: road-flow calc(2.1s / var(--speed)) linear infinite;
    }

    .scene .flag-wave {
      animation: flag-wave calc(2.2s / var(--speed)) ease-in-out infinite;
    }

    .scene.is-paused * { animation-play-state: paused !important; }

    @keyframes wheel-spin { to { transform: rotate(360deg); } }
    @keyframes pelican-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes wing-flap { 0%, 100% { transform: rotate(2deg); } 50% { transform: rotate(-8deg); } }
    @keyframes leg-pedal { 0%, 100% { transform: rotate(7deg); } 50% { transform: rotate(-11deg); } }
    @keyframes cloud-drift { from { transform: translateX(-100px); } to { transform: translateX(1100px); } }
    @keyframes road-flow { from { transform: translateX(0); } to { transform: translateX(-270px); } }
    @keyframes flag-wave { 0%, 100% { transform: skewY(0deg); } 50% { transform: skewY(4deg); } }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      padding: 15px 2px 0;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 4px rgba(120, 183, 168, 0.16);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .speed-control output {
      min-width: 37px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 128px;
      accent-color: var(--coral);
    }

    .play-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 92px;
      justify-content: center;
      padding: 10px 15px;
      border: 0;
      border-radius: 7px;
      background: var(--ink);
      color: #fffdf7;
      font-size: 13px;
      font-weight: 800;
      transition: background 160ms ease, transform 160ms ease;
    }

    .play-button:hover { background: #244d61; }
    .play-button:active { transform: translateY(1px); }
    .play-button:focus-visible,
    input[type="range"]:focus-visible { outline: 3px solid rgba(220, 114, 95, 0.35); outline-offset: 3px; }

    .play-button svg { width: 15px; height: 15px; fill: currentColor; }
    .play-button .pause-mark { display: block; }
    .play-button .play-mark { display: none; }
    .scene.is-paused + .controls .pause-mark { display: none; }
    .scene.is-paused + .controls .play-mark { display: block; }
    .scene.is-paused + .controls .status-dot { background: var(--yellow); box-shadow: 0 0 0 4px rgba(242, 199, 92, 0.18); }

    .microcopy {
      margin: 16px 2px 0;
      color: #789097;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 760px) {
      .page { width: min(100% - 24px, 620px); padding-top: 20px; }
      .topbar { display: block; }
      .route-stats { margin-top: 18px; }
      .stat { flex: 1; min-width: 0; }
      .controls { align-items: flex-start; flex-direction: column; gap: 14px; }
      .control-group { width: 100%; justify-content: space-between; }
      .speed-control { flex: 1; }
      input[type="range"] { width: min(150px, 42vw); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene * { animation-play-state: paused !important; }
      .scene .pelican-bob { transform: none; }
    }
  </style>
</head>

  <script>
    const scene = document.querySelector('.scene');
    const playButton = document.querySelector('.play-button');
    const playLabel = document.querySelector('#playLabel');
    const statusText = document.querySelector('#statusText');
    const speedRange = document.querySelector('#speedRange');
    const speedOutput = document.querySelector('#speedOutput');

    playButton.addEventListener('click', () => {
      const paused = scene.classList.toggle('is-paused');
      playButton.setAttribute('aria-pressed', String(paused));
      playButton.setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
      playLabel.textContent = paused ? '继续' : '暂停';
      statusText.textContent = paused ? '已暂停' : '正在骑行';
    });

    speedRange.addEventListener('input', () => {
      const speed = Number(speedRange.value);
      scene.style.setProperty('--speed', speed);
      speedOutput.textContent = `${speed.toFixed(1)}×`;
    });
  </script>
</body>
</html>
