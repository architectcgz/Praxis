<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e9f3f4">
  <title>鹈鹕骑行记 · 海风慢行</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; color: #244b47; background: #e9f3f4; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible { outline: 3px solid #db754d; outline-offset: 6px; }
    .page { min-height: 100svh; display: flex; flex-direction: column; overflow: hidden; }
    .header { padding: 30px 4.5%; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: flex; gap: 13px; align-items: center; }
    .brand-mark { width: 39px; height: 39px; flex: none; }
    .brand-name { font-size: 17px; font-weight: 700; }
    .brand-caption { display: block; margin-top: 5px; font-size: 9px; color: #647e78; }
    .edition { font-size: 11px; display: flex; align-items: center; gap: 13px; }
    .edition span:first-child { width: 25px; height: 1px; background: #91a8a1; }
    main { flex: 1; display: flex; flex-direction: column; }
    .scene-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 28px 7% 0; position: relative; z-index: 1; }
    .eyebrow { margin: 0 0 12px; color: #6d8982; font-size: 10px; }
    h1 { margin: 0; font-family: "Songti SC", "Noto Serif CJK SC", SimSun, serif; font-size: 38px; line-height: 1.35; font-weight: 500; }
    .weather { display: flex; align-items: center; gap: 10px; font-size: 12px; white-space: nowrap; padding-bottom: 7px; }
    .weather svg { width: 23px; height: 23px; color: #cb9040; }
    .weather-divider { height: 13px; width: 1px; background: #b3c7c0; margin: 0 5px; }
    .scene { position: relative; flex: 1; min-height: 360px; }
    #landscape { display: block; width: 100%; height: min(62vh, 670px); min-height: 360px; }
    .scene-note { position: absolute; left: 7%; bottom: 15%; color: #496b58; }
    .scene-note p { font-size: 10px; margin: 0 0 8px; }
    .scene-note strong { font-size: 12px; font-weight: 500; }
    .controls { background: #f7f9f4; padding: 25px 7%; display: flex; align-items: center; justify-content: space-between; gap: 30px; border-top: 1px solid #d3e1d7; }
    .route { display: flex; align-items: center; gap: 15px; min-width: 0; }
    .route-index { font-family: Georgia, serif; font-style: italic; font-size: 31px; color: #678174; }
    .route-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .route-subtitle { font-size: 10px; color: #7c8d80; }
    .playback { display: flex; align-items: center; gap: 13px; }
    .icon-button { width: 43px; height: 43px; display: grid; place-items: center; background: transparent; border: 1px solid #cbd8cf; border-radius: 50%; color: #31584c; cursor: pointer; flex: none; transition: background .18s, border-color .18s; }
    .icon-button:hover { background: #e5ede5; border-color: #93b1a0; }
    .icon-button.primary { background: #2c594b; color: #fff; border-color: #2c594b; }
    .icon-button.primary:hover { background: #39755d; }
    .icon-button svg { width: 18px; height: 18px; }
    .speed-control { display: flex; align-items: center; gap: 12px; margin-left: 17px; padding-left: 26px; border-left: 1px solid #d7dfd5; }
    .speed-control label { font-size: 11px; color: #718574; }
    input[type="range"] { width: 100px; height: 22px; cursor: pointer; accent-color: #3a7058; }
    output { width: 35px; font-size: 11px; font-variant-numeric: tabular-nums; }
    .ride-status { font-size: 11px; color: #65816d; display: flex; align-items: center; gap: 8px; min-width: 70px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #7b9b60; }
    body.paused .status-dot { background: #ba935e; }
    footer { background: #f7f9f4; padding: 0 7% 20px; display: flex; align-items: center; justify-content: space-between; gap: 18px; color: #8a998b; font-size: 9px; }
    .footer-line { flex: 1; height: 1px; background: #e2e8dd; }
    [hidden] { display: none !important; }
    @media (min-width: 1600px) { .scene-heading { padding-top: 42px; } #landscape { height: min(65vh, 810px); } }
    @media (max-width: 700px) {
      .header { padding: 23px 6%; gap: 12px; }
      .brand-name { font-size: 15px; }
      .edition { font-size: 9px; gap: 7px; }
      .edition span:first-child { width: 14px; }
      .scene-heading { padding: 27px 7% 0; align-items: flex-start; }
      h1 { font-size: 29px; }
      .eyebrow { font-size: 9px; }
      .weather { padding-top: 27px; font-size: 11px; gap: 6px; }
      .weather-description, .weather-divider { display: none; }
      #landscape { height: 53svh; min-height: 370px; max-height: 570px; }
      .scene-note { bottom: 7%; }
      .controls { padding: 20px 7%; gap: 21px; flex-wrap: wrap; }
      .route { flex: 1; }
      .ride-status { order: 1; justify-content: flex-end; }
      .playback { order: 2; width: 100%; }
      .speed-control { flex: 1; margin-left: 8px; padding-left: 20px; gap: 9px; }
      input[type="range"] { flex: 1; min-width: 40px; width: 80px; }
      footer { padding-bottom: 18px; font-size: 8px; gap: 12px; }
    }
    @media (max-width: 360px) { h1 { font-size: 25px; } .edition { display: none; } .brand-caption { font-size: 8px; } }
  </style>
</head>

  <script>
    const element = (id) => document.getElementById(id);
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const narrowScreen = matchMedia('(max-width: 700px)');
    const parts = Object.fromEntries([
      'rear-wheel', 'front-wheel', 'crank', 'far-leg-outline', 'far-leg-color',
      'near-leg-outline', 'near-leg-color', 'near-foot', 'far-foot',
      'cloud-layer', 'hill-layer', 'grass-layer', 'road-marks', 'ripples', 'scarf-tail', 'breeze'
    ].map((id) => [id, element(id)]));
    let running = !reducedMotion.matches;
    let speed = 1;
    let elapsed = 0;
    let lastTime = null;
    let frame = null;

    // 用两段定长腿连接髋部与踏板，让双脚始终跟随同一曲柄，避免踩踏时滑脱。
    function positionLeg(side, phase, hipX, hipY) {
      const footX = 718 + Math.cos(phase) * 42;
      const footY = 584 + Math.sin(phase) * 42;
      const dx = footX - hipX;
      const dy = footY - hipY;
      const distance = Math.hypot(dx, dy);
      const upperLength = 112;
      const lowerLength = 123;
      const along = (upperLength ** 2 - lowerLength ** 2 + distance ** 2) / (2 * distance);
      const bend = Math.sqrt(Math.max(0, upperLength ** 2 - along ** 2));
      const kneeX = hipX + (dx * along + dy * bend) / distance;
      const kneeY = hipY + (dy * along - dx * bend) / distance;
      const path = `M${hipX} ${hipY} L${kneeX} ${kneeY} L${footX} ${footY - 8}`;
      parts[`${side}-leg-outline`].setAttribute('d', path);
      parts[`${side}-leg-color`].setAttribute('d', path);
      parts[`${side}-foot`].setAttribute('transform', `translate(${footX} ${footY})`);
    }

    function render() {
      const phase = elapsed * 2.7;
      const degrees = phase * 180 / Math.PI;
      const distance = elapsed * 310;
      parts['rear-wheel'].setAttribute('transform', `rotate(${distance / 106 * 180 / Math.PI})`);
      parts['front-wheel'].setAttribute('transform', `rotate(${distance / 106 * 180 / Math.PI})`);
      parts.crank.setAttribute('transform', `translate(718 584) rotate(${degrees})`);
      positionLeg('far', phase + Math.PI, 652, 416);
      positionLeg('near', phase, 624, 417);
      parts['cloud-layer'].setAttribute('transform', `translate(${-(distance * 0.045 % 1440)} 0)`);
      parts['hill-layer'].setAttribute('transform', `translate(${-(distance * 0.12 % 1440)} 0)`);
      parts['grass-layer'].setAttribute('transform', `translate(${-(distance % 1440)} 0)`);
      parts['road-marks'].setAttribute('patternTransform', `translate(${-(distance % 230)} 0)`);
      parts.ripples.setAttribute('patternTransform', `translate(${-(distance * 0.2 % 310)} 0)`);
      parts['scarf-tail'].setAttribute('transform', `rotate(${Math.sin(phase * 2) * 4} 690 306)`);
      parts.breeze.setAttribute('transform', `translate(${Math.sin(phase) * 9} 0)`);
      parts.breeze.setAttribute('opacity', 0.4 + Math.sin(phase) * 0.15);
    }

    function tick(now) {
      if (lastTime !== null) elapsed += Math.min((now - lastTime) / 1000, 0.05) * speed;
      lastTime = now;
      render();
      frame = requestAnimationFrame(tick);
    }

    // 暂停或切到后台时停止请求动画帧，恢复时不累计后台经过的时间。
    function syncPlayback() {
      cancelAnimationFrame(frame);
      frame = null;
      lastTime = null;
      element('pause-icon').toggleAttribute('hidden', !running);
      element('play-icon').toggleAttribute('hidden', running);
      element('play-toggle').setAttribute('aria-label', running ? '暂停骑行' : '继续骑行');
      element('play-toggle').title = running ? '暂停骑行' : '继续骑行';
      element('status-label').textContent = running ? '骑行中' : '已暂停';
      document.body.classList.toggle('paused', !running);
      if (running && !document.hidden) frame = requestAnimationFrame(tick);
    }

    function fitScene() {
      element('landscape').setAttribute('viewBox', narrowScreen.matches ? '365 80 760 760' : '0 0 1440 820');
    }

    element('play-toggle').addEventListener('click', () => {
      running = !running;
      syncPlayback();
    });
    element('restart').addEventListener('click', () => {
      elapsed = 0;
      lastTime = null;
      render();
    });
    element('speed').addEventListener('input', (event) => {
      speed = Number(event.target.value);
      element('speed-value').value = `${speed.toFixed(2)}×`;
    });
    document.addEventListener('visibilitychange', syncPlayback);
    reducedMotion.addEventListener('change', () => {
      if (reducedMotion.matches) {
        running = false;
        syncPlayback();
      }
    });
    narrowScreen.addEventListener('change', fitScene);
    fitScene();
    render();
    syncPlayback();
  </script>
</body>
</html>
